name: Sync stock Contabilium -> Shopify

# Corre el sync INCREMENTAL en la nube, gratis (repo publico).
#
# SIN `schedule:` a proposito. Dos razones medidas:
#   1. El schedule de GitHub entrego el 5% de las corridas pedidas: de las ~19.300
#      que pedia el cron */5 solo ocurrieron 2.806 (ver docs/diagnostico-2026-08-19.md, H2).
#   2. Los workflows CON `schedule:` se auto-desactivan a los 60 dias sin actividad
#      en el repo; los que se disparan desde afuera, no (H1).
# El disparo es externo (cron-job.org -> workflow_dispatch) o manual.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = simula y NO escribe en Shopify (recomendado para validar)"
        type: choice
        options: ["true", "false"]
        default: "true"
      full:
        description: "true = RECONCILIACION: ignora la libreta y compara los 2562 SKUs contra Shopify"
        type: choice
        options: ["false", "true"]
        default: "false"
      modo:
        description: "sync = normal · locations = diagnostico SOLO LECTURA del riesgo 1 (no escribe nada)"
        type: choice
        options: ["sync", "locations"]
        default: "sync"
      escritura_absoluta:
        description: "SKUs separados por coma, o \"todos\": fuerza el ABSOLUTO de Contabilium en esta corrida (compuerta manual auditada, ADR 0001). Vacio = apagado."
        type: string
        default: ""
      motivo:
        description: "Obligatorio si escritura_absoluta no esta vacio: por que se fuerza el absoluto."
        type: string
        default: ""

# No arrancar una corrida nueva si la anterior sigue en curso (anti-solapamiento).
concurrency:
  group: sync-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # La PRIMERA corrida no tiene "libreta" -> resuelve los 2562 SKUs contra
    # Shopify (~26 min) y la siembra. Las siguientes son incrementales (~1 min).
    #
    # 50 y no 30: la libreta se persiste RECIEN AL FINAL de syncTodos. Si el job
    # muere por timeout antes de eso, la corrida siguiente vuelve a empezar de
    # cero y el ciclo no cierra nunca (agravante de H3 en el diagnostico).
    # El margen se saca cuando el trabajo sea reanudable por checkpoint.
    timeout-minutes: 50
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        run: npm ci

      # Recuperar la "libreta" (.cache/last-sync.json + sku-map.json) de la corrida
      # anterior. La key incluye run_id (unica), y restore-keys baja la mas reciente.
      - name: Restaurar estado (cache)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      # Compuerta manual auditada (R-6, ADR 0001): escritura_absoluta requiere
      # motivo explicito. Falla ANTES de correr el sync si falta, y deja el
      # alcance/motivo impresos en el log de esta corrida (auditable sin
      # tocar ningun archivo del repo).
      - name: Validar compuerta manual
        env:
          ESCRITURA_ABSOLUTA: ${{ inputs.escritura_absoluta }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          # Un motivo de solo espacios (espacios, tabs, saltos de linea) cuenta como vacio.
          if [ -n "$ESCRITURA_ABSOLUTA" ] && [ -z "${MOTIVO//[[:space:]]/}" ]; then
            echo "::error::escritura_absoluta requiere un motivo no vacio (compuerta auditada, ADR 0001)"
            exit 1
          fi
          if [ -n "$ESCRITURA_ABSOLUTA" ]; then
            # N-10: los valores son texto libre. Van SOLO dentro de los datos de
            # este ::warning::, con %, CR y LF escapados (% primero), para que no
            # partan la linea ni formen otro comando (:: o el formato viejo ##[).
            a="${ESCRITURA_ABSOLUTA//'%'/%25}"; a="${a//$'\r'/%0D}"; a="${a//$'\n'/%0A}"
            m="${MOTIVO//'%'/%25}"; m="${m//$'\r'/%0D}"; m="${m//$'\n'/%0A}"
            echo "::warning::ESCRITURA ABSOLUTA activa. Alcance: $a — Motivo: $m"
          fi

      # --full ignora la libreta local y verifica los 2562 SKUs contra Shopify.
      # Es el modo reconciliacion: detecta la deriva que el incremental no ve,
      # porque el incremental confia en la libreta y la libreta espeja Contabilium.
      - name: Correr sync
        run: |
          if [ "${{ inputs.modo }}" = "locations" ]; then
            node src/index.js --locations
          else
            node src/index.js ${{ inputs.full == 'true' && '--full' || '' }}
          fi
        env:
          # La compuerta viaja SOLO por entorno (R-6/R-13): index.js la lee de
          # ESCRITURA_ABSOLUTA. Nunca por argv ni interpolada en el script.
          ESCRITURA_ABSOLUTA: ${{ inputs.escritura_absoluta }}
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # NO es un secreto: es una version de contrato y tiene que estar a la
          # vista, versionada con el codigo que la asume. Hasta 2026-01 el input
          # de inventorySetQuantities usaba `compareQuantity`; desde 2026-04 ese
          # campo fue eliminado y su reemplazo es `changeFromQuantity`.
          # Ver docs/specs/001-dot-stock-sync/findings/p0-shopify-app.md
          SHOPIFY_API_VERSION: "2026-04"
          SHOPIFY_DOT_LOCATION_ID: ${{ secrets.SHOPIFY_DOT_LOCATION_ID }}
          SHOPIFY_ISLA_LOCATION_ID: ${{ secrets.SHOPIFY_ISLA_LOCATION_ID }}
          CONTABILIUM_API_URL: ${{ secrets.CONTABILIUM_API_URL }}
          CONTABILIUM_CLIENT_ID: ${{ secrets.CONTABILIUM_CLIENT_ID }}
          CONTABILIUM_CLIENT_SECRET: ${{ secrets.CONTABILIUM_CLIENT_SECRET }}
          CONTABILIUM_DOT_DEPOSITO_ID: ${{ secrets.CONTABILIUM_DOT_DEPOSITO_ID }}
          CONTABILIUM_ISLA_DEPOSITO_ID: ${{ secrets.CONTABILIUM_ISLA_DEPOSITO_ID }}
          # Por defecto SIMULA. Escribir en Shopify es una decision explicita.
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
          # Este repo es PUBLICO y con el los logs de sus corridas. Con
          # LOG_VERBOSE=true el log escribe una linea por SKU con su cantidad,
          # o sea el catalogo entero: dejarlo apagado no es cosmetico.
          LOG_VERBOSE: "false"

      # Guardar la libreta actualizada para la proxima corrida (siempre, aun si fallo).
      - name: Guardar estado (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: sync-state-${{ github.run_id }}
