name: Sync stock Contabilium -> Shopify

# Corre el sync INCREMENTAL en la nube, gratis (repo publico).
#
# SIN `schedule:` a proposito. Dos razones medidas:
#   1. El schedule de GitHub entrego el 5% de las corridas pedidas: de las ~19.300
#      que pedia el cron */5 solo ocurrieron 2.806 (ver docs/diagnostico-2026-08-19.md, H2).
#   2. Los workflows CON `schedule:` se auto-desactivan a los 60 dias sin actividad
#      en el repo; los que se disparan desde afuera, no (H1).
# El disparo es externo (cron-job.org -> workflow_dispatch) o manual.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = simula y NO escribe en Shopify (recomendado para validar)"
        type: choice
        options: ["true", "false"]
        default: "true"
      full:
        description: "true = RECONCILIACION: ignora la libreta y compara los 2562 SKUs contra Shopify"
        type: choice
        options: ["false", "true"]
        default: "false"

# No arrancar una corrida nueva si la anterior sigue en curso (anti-solapamiento).
concurrency:
  group: sync-stock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # La PRIMERA corrida no tiene "libreta" -> resuelve los 2562 SKUs contra
    # Shopify (~26 min) y la siembra. Las siguientes son incrementales (~1 min).
    #
    # 50 y no 30: la libreta se persiste RECIEN AL FINAL de syncTodos. Si el job
    # muere por timeout antes de eso, la corrida siguiente vuelve a empezar de
    # cero y el ciclo no cierra nunca (agravante de H3 en el diagnostico).
    # El margen se saca cuando el trabajo sea reanudable por checkpoint.
    timeout-minutes: 50
    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Instalar dependencias
        run: npm ci

      # Recuperar la "libreta" (.cache/last-sync.json + sku-map.json) de la corrida
      # anterior. La key incluye run_id (unica), y restore-keys baja la mas reciente.
      - name: Restaurar estado (cache)
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: sync-state-${{ github.run_id }}
          restore-keys: |
            sync-state-

      # --full ignora la libreta local y verifica los 2562 SKUs contra Shopify.
      # Es el modo reconciliacion: detecta la deriva que el incremental no ve,
      # porque el incremental confia en la libreta y la libreta espeja Contabilium.
      - name: Correr sync
        run: node src/index.js ${{ inputs.full == 'true' && '--full' || '' }}
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          # NO es un secreto: es una version de contrato y tiene que estar a la
          # vista, versionada con el codigo que la asume. Hasta 2026-01 el input
          # de inventorySetQuantities usaba `compareQuantity`; desde 2026-04 ese
          # campo fue eliminado y su reemplazo es `changeFromQuantity`.
          # Ver docs/specs/001-dot-stock-sync/findings/p0-shopify-app.md
          SHOPIFY_API_VERSION: "2026-04"
          SHOPIFY_DOT_LOCATION_ID: ${{ secrets.SHOPIFY_DOT_LOCATION_ID }}
          CONTABILIUM_API_URL: ${{ secrets.CONTABILIUM_API_URL }}
          CONTABILIUM_CLIENT_ID: ${{ secrets.CONTABILIUM_CLIENT_ID }}
          CONTABILIUM_CLIENT_SECRET: ${{ secrets.CONTABILIUM_CLIENT_SECRET }}
          CONTABILIUM_DOT_DEPOSITO_ID: ${{ secrets.CONTABILIUM_DOT_DEPOSITO_ID }}
          # Por defecto SIMULA. Escribir en Shopify es una decision explicita.
          DRY_RUN: ${{ inputs.dry_run || 'true' }}

      # Guardar la libreta actualizada para la proxima corrida (siempre, aun si fallo).
      - name: Guardar estado (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: sync-state-${{ github.run_id }}
